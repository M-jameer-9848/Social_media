    body::before {

        linear-gradient(90deg, rgba(0,255,80,0.035) 1px, transparent 1px);

      background-size: 28px 28px;
      pointer-events: none;
    }

    /* Scanline effect */
    body::after {
      content: "";
      position: fixed;
      inset: 0;

      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,255,80,0.018) 4px

      border: 2px solid #00ff66;

        0 0 25px rgba(0,255,102,0.45),
        inset 0 0 15px rgba(0,255,102,0.3);

      background: #020502;

      position: relative;
    }

    .profile::before,
    .profile::after {
      content: "";
      position: absolute;

      inset: -7px;

      border-radius: 50%;

      border: 1px solid rgba(0,255,102,0.28);

    .profile::after {

      border-color: rgba(0,255,102,0.10);

    /* Time box */

        10px 0,

        100% 10px,
        100% calc(100% - 10px),
        calc(100% - 10px) 100%,
        10px 100%,
        0 calc(100% - 10px),
        0 10px

    }

    .time-label {
      font-size: 9px;
      letter-spacing: 3px;
      color: rgba(0,255,102,0.65);
      margin-bottom: 3px;
    }

    #time {

      font-weight: 900;

      letter-spacing: 2px;

      color: #00ff66;

      text-shadow:

    #date {

    /* Buttons */
    .buttons {

    .cyber-btn {

      font-weight: 900;

      letter-spacing: 1.5px;

      border: 1px solid #00ff66;

      background: rgba(0,255,102,0.035);

      box-shadow:
        0 0 5px rgba(0,255,102,0.2),
        inset 0 0 12px rgba(0,255,102,0.025);

      position: relative;

      transition:
        0.18s ease;

      clip-path: polygon(
        8px 0,
        calc(100% - 8px) 0,
        100% 8px,
        100% calc(100% - 8px),
        calc(100% - 8px) 100%,
        8px 100%,
        0 calc(100% - 8px),
        0 8px
      );
    }

    .cyber-btn:hover,
    .cyber-btn:active {
      background: #00ff66;

      box-shadow:

        0 0 28px rgba(0,255,102,0.5);

    .cyber-btn span {

    /* Audio */

    /* Footer */

    .footer strong {

    /* Tiny terminal cursor */
    .cursor {
      display: inline-block;

      width: 6px;
      height: 11px;

      background: #00ff66;

      vertical-align: -1px;

    @keyframes blink {

      }

      46%, 100% {

    /* Very small phones */

  <script>

    /* =========================================
       KARACHI TIME SYSTEM
       API + AUTOMATIC FALLBACK
       ========================================= */

    const timeElement = document.getElementById("time");
    const dateElement = document.getElementById("date");

    let currentTime = null;
    let lastSuccessfulApiTime = null;

    const TIME_API =
      "https://worldtime.timezone.io/api/timezone/Asia/Karachi";


    function formatTime(date) {

      return new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Karachi",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      }).format(date);

    }


    function formatDate(date) {

      return new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Karachi",
        day: "2-digit",
        month: "short",
        year: "numeric"
      }).format(date).toUpperCase();

    }


    function showTime(date) {

      timeElement.textContent = formatTime(date);

      dateElement.textContent =
        formatDate(date) + " • PKT";

    }


    /*
      Get official Karachi time from API.
      If API fails, the existing local clock continues.
    */
    async function getKarachiTime() {

      try {

        const controller = new AbortController();

        const timeout = setTimeout(() => {
          controller.abort();
        }, 5000);


        const response = await fetch(TIME_API, {
          method: "GET",
          cache: "no-store",
          signal: controller.signal
        });


        clearTimeout(timeout);


        if (!response.ok) {
          throw new Error("TIME API ERROR");
        }


        const data = await response.json();


        if (!data.datetime) {
          throw new Error("INVALID TIME DATA");
        }


        currentTime = new Date(data.datetime);

        lastSuccessfulApiTime = Date.now();


        showTime(currentTime);


      } catch (error) {

        /*
          IMPORTANT:
          API failure does NOT stop the clock.
        */

        if (!currentTime) {

          /*
            First-load fallback.
            Pakistan is UTC+05:00.
          */

          currentTime = new Date(
            new Date().getTime() + (5 * 60 * 60 * 1000)
          );

        }

        showTime(currentTime);
      }

    }


    /*
      Keep clock running every second.
      Even if API goes offline, this continues.
    */
    setInterval(() => {

      if (currentTime) {

        currentTime =
          new Date(currentTime.getTime() + 1000);

        showTime(currentTime);

      }

    }, 1000);


    /*
      Refresh from API periodically.
      The website does NOT depend on this
      request to keep the clock running.
    */
    getKarachiTime();

    setInterval(() => {

      getKarachiTime();

    }, 60000);



    /* =========================================
       AUDIO PLAYER
       ========================================= */

    const audio =
      document.getElementById("myAudio");

    const audioButton =
      document.getElementById("audioButton");

    const audioText =
      document.getElementById("audioText");

    const audioStatus =
      document.getElementById("audioStatus");


    audioButton.addEventListener("click", async () => {

      try {

        if (audio.paused) {

          await audio.play();

          audioText.textContent =
            "❚❚ 𝐏𝐀𝐔𝐒𝐄 𝐀𝐔𝐃𝐈𝐎";

          audioStatus.textContent =
            "𝐀𝐔𝐃𝐈𝐎 𝐏𝐋𝐀𝐘𝐈𝐍𝐆...";

        } else {

          audio.pause();

          audioText.textContent =
            "▶ 𝐏𝐋𝐀𝐘 𝐀𝐔𝐃𝐈𝐎";

          audioStatus.textContent =
            "𝐀𝐔𝐃𝐈𝐎 𝐏𝐀𝐔𝐒𝐄𝐃";

        }

      } catch (error) {

        audioStatus.textContent =
          "𝐀𝐔𝐃𝐈𝐎 𝐅𝐈𝐋𝐄 𝐍𝐎𝐓 𝐅𝐎𝐔𝐍𝐃";

      }

    });


    audio.addEventListener("ended", () => {

      audioText.textContent =
        "▶ 𝐏𝐋𝐀𝐘 𝐀𝐔𝐃𝐈𝐎";

      audioStatus.textContent =
        "𝐀𝐔𝐃𝐈𝐎 𝐅𝐈𝐍𝐈𝐒𝐇𝐄𝐃";

    });


    audio.addEventListener("error", () => {

      audioStatus.textContent =
        "𝐀𝐔𝐃𝐈𝐎 𝐅𝐈𝐋𝐄 𝐍𝐎𝐓 𝐅𝐎𝐔𝐍𝐃";

    });

  </script>
